[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tafr-knee"
version = "0.1.0"
description = "Trade-off-Active Finite-Radius knee detection via preference stability"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Hongxuan Wang" },
]
keywords = [
  "multiobjective optimization",
  "knee point",
  "preference stability",
  "decision making",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
pyomo = ["pyomo>=6.7"]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]
dev = [
  "build>=1.2",
  "matplotlib>=3.7",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
tafr-knee = "tafrknee.cli:main"

[project.urls]
Homepage = "https://github.com/beam4869/TAFR_Knee"
Repository = "https://github.com/beam4869/TAFR_Knee"
Issues = "https://github.com/beam4869/TAFR_Knee/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tafrknee"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
